services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracewright
      POSTGRES_DB: tracewright
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracewright -d tracewright"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    environment:
      TRACEWRIGHT_DATABASE_URL: postgresql+psycopg://tracewright:${POSTGRES_PASSWORD}@db:5432/tracewright
    depends_on:
      db:
        condition: service_healthy
    command: ["tracewright", "migrate"]
  api:
    build: .
    environment:
      TRACEWRIGHT_DATABASE_URL: postgresql+psycopg://tracewright:${POSTGRES_PASSWORD}@db:5432/tracewright
      TRACEWRIGHT_API_TOKEN: ${TRACEWRIGHT_API_TOKEN:?Set TRACEWRIGHT_API_TOKEN in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  postgres-data:
